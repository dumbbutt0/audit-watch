via_ir = true
optimizer = true
optimizer_runs = 800
remappings = [
  'forge-std/=lib/forge-std/src/',
  '@openzeppelin/=/tmp/p102-iqai/node_modules/@openzeppelin/',
  'permit2/=/tmp/p93-ramses/lib/permit2/src/',
  'ramses/=/tmp/p93-ramses/contracts/',
]
