# Sui-Move PROPERTY-FUZZ harness template (P141 fuzz lane).
# Copy to pocs/<audit-id>/fuzz/<invariant-id>/ and point `Target` at the in-scope package (the audited code).
# Run with: `sui move test` (Sui CLI on PATH). If the target pins a dead testnet framework, build with
# `sui move test --env mainnet` (see documentation/move_support.md / project memory).
#
# This is a PROPERTY harness: it states an invariant, exercises the REAL target over a deterministic
# pseudo-random sequence of operations, and includes a NEGATIVE CONTROL (the same invariant must HOLD for
# well-formed inputs) so the fuzz-evidence gate can rule out a broken harness before any signal is promoted.
[package]
name = "MoveFuzz"
edition = "2024.beta"

[dependencies]
# Point at the cloned, UNMODIFIED in-scope package (never copy/patch the target into the harness):
Target = { local = "../../../<path-to-target-package>" }

[addresses]
fuzz = "0x0"
