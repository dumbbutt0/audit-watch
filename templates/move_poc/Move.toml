# Sui-Move PoC package template. Copy to pocs/<audit-id>/<finding-id>/ and point the dependency at the
# in-scope package (local path to the cloned target). Run with: `sui move test` (Sui CLI on PATH).
#
# The in-scope package is added as a LOCAL dependency so the PoC exercises the REAL audited code unmodified —
# never copy/patch the target source into the PoC. If the target's modules are not test-visible, add a thin
# `#[test_only]` accessor in the PoC module that calls the real public entry points (do NOT weaken the target).
[package]
name = "MovePoC"
edition = "2024.beta"

[dependencies]
# Point this at the cloned, UNMODIFIED in-scope package (the audited code under test):
Target = { local = "../../../<path-to-target-package>" }
# Sui framework is resolved implicitly by the Sui CLI from the target's Move.lock / system packages.

[addresses]
poc = "0x0"
