# Solana PoC template — copy to pocs/<audit>/<finding-id>/ and fill in.
#
# Uses litesvm (fast in-process Solana VM) for deterministic L2 state assertions. Swap to
# solana-program-test (BanksClient) if you need full runtime parity / sysvar fidelity.
#
# Build the target program crate as a path dependency so the PoC links the EXACT in-scope code
# (no re-implementation). Point the path at the contest source under contracts/_sources/.
[package]
name = "poc-FINDING-ID"
version = "0.1.0"
edition = "2021"

[lib]
name = "poc_finding_id"
path = "src/lib.rs"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.1"
solana-program = "2.1"
spl-token = { version = "7.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0", features = ["no-entrypoint"] }
# The in-scope program, linked as a path dep so the PoC exercises the real code:
# target-program = { path = "../../../contracts/_sources/<repo>/programs/<program>" }
