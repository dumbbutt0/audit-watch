# Secret / private-key exposure rules. Matches are REDACTED in output.

# High-confidence material — committed private keys / seed phrases.
secret_patterns:
  - pattern: '-----BEGIN\s+(RSA|EC|OPENSSH|PGP|DSA)?\s*PRIVATE KEY-----'
    category: private_key_block
    severity: CRITICAL
    message: 'PEM private key block committed in the repository.'
  - pattern: '\b(0x)?[a-fA-F0-9]{64}\b'
    category: hex_privkey_like
    severity: HIGH
    message: 'A 32-byte hex string that may be an EVM/Solana private key.'
    # gated by a context keyword (see needs_context) to avoid matching hashes/bytecode
    needs_context: '(private|priv|secret|mnemonic|seed|key|pk)\b'
  - pattern: '\b([a-z]+\s+){11}([a-z]+)\b'
    category: mnemonic_like
    severity: HIGH
    message: 'A 12-word lowercase sequence that may be a BIP-39 mnemonic / seed phrase.'
    needs_context: '(mnemonic|seed\s*phrase|recovery\s*phrase|MNEMONIC|SEED)'

# Named API keys / tokens (assignment form `KEY=...` or `KEY: ...`).
named_keys:
  - name: AWS_SECRET_ACCESS_KEY
    severity: HIGH
  - name: AWS_ACCESS_KEY_ID
    severity: MEDIUM
  - name: GITHUB_TOKEN
    severity: HIGH
  - name: GH_TOKEN
    severity: HIGH
  - name: INFURA_API_KEY
    severity: MEDIUM
  - name: INFURA_KEY
    severity: MEDIUM
  - name: ALCHEMY_API_KEY
    severity: MEDIUM
  - name: ALCHEMY_KEY
    severity: MEDIUM
  - name: HELIUS_API_KEY
    severity: MEDIUM
  - name: ETHERSCAN_API_KEY
    severity: LOW
  - name: PRIVATE_KEY
    severity: HIGH
  - name: DEPLOYER_PRIVATE_KEY
    severity: HIGH
  - name: MNEMONIC
    severity: HIGH
  - name: SEED_PHRASE
    severity: HIGH

# Token shapes recognizable on their own.
token_patterns:
  - pattern: '\bAKIA[0-9A-Z]{16}\b'
    category: aws_access_key_id
    severity: HIGH
    message: 'AWS access key ID pattern.'
  - pattern: '\bghp_[A-Za-z0-9]{36}\b'
    category: github_pat
    severity: HIGH
    message: 'GitHub personal access token pattern.'
  - pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
    category: slack_token
    severity: HIGH
    message: 'Slack token pattern.'

# Solana keypair files: 64-element JSON int arrays (id.json / keypair.json).
solana_keypair_basenames:
  - id.json
  - keypair.json
  - wallet.json
solana_keypair_array: '\[\s*\d{1,3}\s*(,\s*\d{1,3}\s*){63,}\]'

# Filenames that should not be committed (env / key files).
risky_filenames:
  - .env
  - .env.local
  - .env.production
