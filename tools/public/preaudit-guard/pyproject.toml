[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "preaudit-guard"
version = "0.1.0"
description = "Static, offline preflight scanner that quarantines an unknown codebase before an AI agent or human auditor reviews it — flags prompt-injection traps, malicious lifecycle/build scripts, and exposed secrets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dumbbutt0" }]
keywords = ["security", "audit", "prompt-injection", "supply-chain", "preflight", "sast", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/dumbbutt0/preaudit-guard"

[project.scripts]
preaudit = "preaudit_guard.cli:main"

[tool.setuptools]
packages = ["preaudit_guard", "preaudit_guard.detectors"]

[tool.setuptools.package-data]
preaudit_guard = ["rules/*.yml"]
